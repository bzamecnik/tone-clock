<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tone Clock</title>
    <meta name="description" content="Explore chords, scales and keys on a circle of the 12 pitch classes." />
    <script>
      // apply the stored theme before the first paint (see useTheme.ts)
      try {
        const setting = localStorage.getItem('tone-clock:theme')
        const dark =
          setting === 'dark' ||
          (setting !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        // storage unavailable: useTheme applies the theme after rendering
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
